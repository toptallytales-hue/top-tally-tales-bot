name: "Post Daily Sports Shorts"

on:
  schedule:
    - cron: "23 * * * *"   # Runs at minute 23 of every hour
  workflow_dispatch:        # Allows manual run
    inputs:
      approve:
        description: 'Approve and post?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  post-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser requests

      - name: Run the news fetching script
        env:
          APPROVE: ${{ github.event.inputs.approve }}
        run: python post_news.py
