name: "Post Daily Sports Shorts"

on:
  schedule:
    - cron: "23 * * * *"   # Runs at minute 23 of every hour
  workflow_dispatch:        # Allows manual run
    inputs:
      approve:
        description: 'Approve and post?'
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'

jobs:
  post-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
  run: |
    pip install feedparser requests pillow gTTS google-api-python-client google-auth-oauthlib
    sudo apt-get update
    sudo apt-get install -y ffmpeg

      - name: Run the YouTube Shorts automation
        env:
          APPROVE: ${{ github.event.inputs.approve }}
          # YouTube OAuth2 credentials (add these as secrets)
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python post_news.py
